name: Publish to PyPI
run-name: Publish ${{ inputs.tag }} to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable annotated tag to publish, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type publish to confirm the production upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEPA_MCP_CONFIG_FILE: /tmp/nepa-mcp-release-credentials.env
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.26"
          python-version: "3.12"
          enable-cache: false

      - name: Verify the release ref and version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${RELEASE_CONFIRMATION}" != "publish" ]]; then
            echo "The confirmation input must be exactly: publish" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]]; then
            echo "Dispatch this workflow from the same tag supplied in the tag input." >&2
            exit 1
          fi

          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vX.Y.Z tags can be published to production PyPI." >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "${RELEASE_TAG}")" != "tag" ]]; then
            echo "The release ref must be an annotated tag." >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "The checked-out commit does not match the annotated release tag." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          git merge-base --is-ancestor "${tag_commit}" origin/main

          expected_version="${RELEASE_TAG#v}"
          package_version="$(
            uv run --no-project python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "${package_version}" != "${expected_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

          grep -Fx "version: ${expected_version}" CITATION.cff
          grep -F "__version__ = \"${expected_version}\"" nepa_mcp/__init__.py
          grep -F "version      = {${expected_version}}," README.md

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run release checks
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen pytest -q
          uv run --frozen pip-audit --progress-spinner off

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx --from "twine==7.0.0" twine check dist/*

      - name: Install and smoke-test the built wheel
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/nepa-mcp-release-venv"
          uv pip install \
            --python "${RUNNER_TEMP}/nepa-mcp-release-venv/bin/python" \
            dist/*.whl
          "${RUNNER_TEMP}/nepa-mcp-release-venv/bin/nepa-mcp" --version
          "${RUNNER_TEMP}/nepa-mcp-release-venv/bin/nepa-mcp" doctor
          "${RUNNER_TEMP}/nepa-mcp-release-venv/bin/nepa-mcp" list-servers
          "${RUNNER_TEMP}/nepa-mcp-release-venv/bin/python" \
            scripts/smoke_test_distribution.py \
            --expected-version "${RELEASE_TAG#v}"

      - name: Record artifact hashes
        run: |
          {
            echo "## Distribution SHA-256"
            echo
            echo '~~~text'
            sha256sum dist/*
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload production distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/nepa-mcp/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          skip-existing: false
          verbose: true
