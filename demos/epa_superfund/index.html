<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPA Superfund | NEPA-MCP demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#202727;background:#f5f7f6;font-size:14px;letter-spacing:0;--line:#dce2df;--green:#146b50;--muted:#62706a}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer}a{color:var(--green);text-underline-offset:3px}button{border:0;background:none;color:inherit}header{background:#fff;border-bottom:1px solid var(--line);padding:20px 30px;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:23px;margin:0 0 4px;font-weight:650}h2{font-size:21px;margin:0 0 8px}h3{font-size:15px;margin:22px 0 10px}p{line-height:1.6}.muted{color:var(--muted)}.eyebrow{font-size:11px;text-transform:uppercase;font-weight:650;color:var(--muted);margin-bottom:8px}.stamp{font-size:12px;white-space:nowrap}.brand{display:flex;align-items:center;gap:14px}.mark{width:40px;height:40px;display:grid;place-items:center;background:#e5f1eb;color:var(--green);border-radius:6px}.topnav{display:flex;gap:24px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}.topnav button{padding:14px 0;border-bottom:3px solid transparent;white-space:nowrap}.topnav button.active{border-bottom-color:var(--green);color:var(--green);font-weight:650}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 146px)}aside{padding:26px 14px;background:#f0f4f1;border-right:1px solid var(--line)}aside .eyebrow{padding:0 12px}.tool{display:flex;gap:11px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:5px;margin:3px 0;font-size:13px;line-height:1.35}.tool.active{background:#fff;box-shadow:0 1px 3px #203f3010;color:var(--green);font-weight:650}.tool:hover{background:#e6eee8}.tool svg{flex-shrink:0;width:17px;height:17px}.aside-foot{border-top:1px solid var(--line);padding:16px 12px;font-size:11px;line-height:1.6;margin-top:22px;color:var(--muted)}main{padding:30px;min-width:0;max-width:1600px;width:100%;margin:auto;align-self:start}.toolbar{display:flex;gap:20px;justify-content:space-between;align-items:flex-start}.toolbar select{max-width:100%;padding:9px 30px 9px 12px;border:1px solid var(--line);border-radius:4px;background:white;font-size:12px;min-width:230px}.case-name{font-size:14px;margin:6px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);margin:22px 0;background:#fff}.metric{padding:16px 20px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric strong{font-size:25px;display:block;font-weight:600;margin-bottom:3px}.metric span{font-size:12px;color:var(--muted)}.metric.warning strong{color:#a45418}.notice{border-left:3px solid #b36a20;background:#fff4e8;padding:12px 16px;color:#77451a;font-size:12px;line-height:1.6;margin:12px 0 20px}.notice.good{border-color:var(--green);background:#eaf4ef;color:#286047}.subnav{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:8px 0 18px;overflow-x:auto}.subnav button{display:flex;align-items:center;gap:7px;padding:13px 0;border-bottom:2px solid transparent;white-space:nowrap}.subnav .active{border-color:var(--green);color:var(--green);font-weight:600}.subnav svg,.icon-button svg{width:16px;height:16px}.filterbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:16px 0}.filterbar input{border:1px solid var(--line);border-radius:4px;padding:9px 12px;background:#fff;width:270px;max-width:65%}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff}table{border-collapse:collapse;width:100%;font-size:12px;text-align:left}th{font-size:10px;color:#68716d;text-transform:uppercase;font-weight:650;background:#f9fbf9;white-space:nowrap}td,th{padding:13px 14px;border-bottom:1px solid #e6ebe7;vertical-align:top;line-height:1.5}td{min-width:100px;max-width:430px;overflow-wrap:anywhere}tr:last-child td{border-bottom:0}td:first-child{font-weight:500}.badge{display:inline-block;padding:3px 7px;border-radius:3px;font-size:10px;background:#ecf0ee;color:#54635b;white-space:nowrap}.badge.complete,.badge.empty{background:#e7f3ed;color:#236548}.badge.failed,.badge.partial,.badge.truncated{background:#fce9e5;color:#a23d31}.badge.disabled,.badge.unsupported,.badge.skipped{background:#f8eedc;color:#8d6226}.paging{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12px;color:var(--muted)}.icon-button{border:1px solid var(--line);background:white;border-radius:4px;display:inline-grid;place-items:center;width:32px;height:32px;margin-left:5px}.icon-button:disabled{opacity:.35;cursor:default}.empty{padding:36px;text-align:center;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid var(--line);padding:20px;border-radius:4px;font-size:12px;line-height:1.7;max-height:650px;overflow:auto}.code{font-family:ui-monospace,monospace;font-size:12px;overflow-wrap:anywhere}.map-shell{margin-bottom:20px}.map-caption{font-size:11px;color:var(--muted);padding-top:8px;line-height:1.5}#map{height:280px;width:100%;background:#e4ece4;border:1px solid var(--line);border-radius:4px;z-index:0}.content-section{padding:0 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:35px}.bodycopy{max-width:950px;font-size:14px}.bodycopy li{line-height:1.7;margin:8px 0}.finding{padding:18px 0;border-bottom:1px solid var(--line)}.finding h3{margin-top:0}.finding p{margin-bottom:0}.bars{display:grid;gap:15px;margin:22px 0}.bar-row{display:grid;grid-template-columns:160px minmax(0,1fr) 70px;gap:16px;align-items:center;font-size:12px}.track{height:14px;background:#e6ece8;border-radius:2px;overflow:hidden}.fill{height:100%;background:#83a598}.bar-row.current .fill{background:#9b5271}.bar-row.current{font-weight:650}details{margin-top:20px;font-size:12px}summary{cursor:pointer;color:var(--muted)}footer{padding-top:24px;font-size:11px;line-height:1.7;color:var(--muted)}.hidden{display:none!important}.mono-label{font-size:11px;overflow-wrap:anywhere;margin-top:12px;color:var(--muted)}.icon-link{display:inline-flex;gap:6px;align-items:center}.leaflet-container{font-family:inherit}
@media(max-width:800px){header{padding:18px}.stamp{display:none}.topnav{padding-inline:18px}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;overflow-x:auto;gap:5px}aside>.eyebrow,.aside-foot{display:none}.tool{width:auto;flex:0 0 auto;white-space:nowrap;font-size:12px;padding:10px;margin:0}.tool svg{width:15px;height:15px}main{padding:22px 16px}.toolbar{flex-direction:column;gap:14px}.toolbar select{width:100%}.toolbar>div:last-child{width:100%}.metric{padding:13px 10px}.metric strong{font-size:22px}.metric span{font-size:10px}.columns{grid-template-columns:1fr;gap:10px}.bar-row{grid-template-columns:110px minmax(0,1fr) 52px;gap:10px}.subnav{gap:15px}h1{font-size:20px}td,th{padding:11px}#map{height:235px}.filterbar{font-size:11px}}
</style>
<style>form{display:flex;align-items:end;flex-wrap:wrap;gap:12px;margin:20px 0}form label{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--muted);max-width:100%}form input{border:1px solid var(--line);border-radius:4px;padding:9px 11px;min-width:0;max-width:100%}.numeric{width:130px}#run-state{font-size:12px;align-self:center;min-height:18px;overflow-wrap:anywhere;color:var(--muted)}</style>
</head>
<body>
<header><div class="brand"><div class="mark"><i data-lucide="layers-3"></i></div><div><h1>EPA Superfund</h1><div class="muted" style="font-size:12px">NEPA-MCP / epa_superfund demo</div></div></div><div class="stamp muted"></div></header>
<nav class="topnav" aria-label="Demo views"><button class="active" data-view="evidence">Evidence</button><button data-view="rules">EPA access</button></nav>
<div class="layout"><aside id="tools" aria-label="Superfund tools"></aside><main id="main"></main></div>
<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" integrity="sha384-uTYyvsSSUZeaPhb5RbKlQa0zY/WpX/QHfvg2mczXyBQOpkWPEDy9lczyp+w7SKXu" crossorigin="anonymous"></script>

<script src="app.js"></script>
</body></html>
