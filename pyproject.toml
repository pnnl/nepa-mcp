[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nepa-mcp"
version = "0.1.3"
description = "MCP servers for federal environmental data, regulatory research, and geospatial screening"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Sarthak Chaturvedi" },
    { name = "Renuka Chintalapati" },
    { name = "Daniel Nally" },
    { name = "Mike Parker" },
    { name = "Sai Munikoti" },
    { name = "Sameera Horawalavithana" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "cryptography>=50.0.0",
    "fastmcp==3.4.4",
    "folium>=0.20.0",
    "httpx>=0.28.0",
    "mcp>=1.28.1",
    "platformdirs>=4.0.0",
    "pyproj>=3.7.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "shapely>=2.0.0",
    "sse-starlette>=3.0.0",
    "starlette>=0.48.0",
    "tomlkit>=0.13.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
nepa-mcp = "nepa_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/pnnl/nepa-mcp"
Documentation = "https://pnnl.github.io/nepa-mcp/"
Repository = "https://github.com/pnnl/nepa-mcp"
Issues = "https://github.com/pnnl/nepa-mcp/issues"
Releases = "https://github.com/pnnl/nepa-mcp/releases"

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["nepa_mcp", "nepa_mcp_common"]

[tool.hatch.build.targets.sdist]
include = [
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/MAINTAINERS.md",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/SUPPORT.md",
    "/pyproject.toml",
    "/CITATION.cff",
    "/nepa_mcp",
    "/nepa_mcp_common",
    "/blm",
    "/census",
    "/cfr",
    "/efh",
    "/epa_acres",
    "/epa_aqs",
    "/esa_ranges",
    "/fema_nfhl",
    "/gbif",
    "/gis",
    "/ipac",
    "/map_composer",
    "/nepa_assist",
    "/noaa",
    "/nrhp",
    "/padus",
    "/pcsrf",
    "/tigerweb_counties",
    "/tribal",
    "/usace",
]

[tool.hatch.build.targets.wheel.force-include]
"blm" = "nepa_mcp/_servers/blm"
"census" = "nepa_mcp/_servers/census"
"cfr" = "nepa_mcp/_servers/cfr"
"efh" = "nepa_mcp/_servers/efh"
"epa_acres" = "nepa_mcp/_servers/epa_acres"
"epa_aqs" = "nepa_mcp/_servers/epa_aqs"
"esa_ranges" = "nepa_mcp/_servers/esa_ranges"
"fema_nfhl" = "nepa_mcp/_servers/fema_nfhl"
"gbif" = "nepa_mcp/_servers/gbif"
"gis" = "nepa_mcp/_servers/gis"
"ipac" = "nepa_mcp/_servers/ipac"
"map_composer" = "nepa_mcp/_servers/map_composer"
"nepa_assist" = "nepa_mcp/_servers/nepa_assist"
"noaa" = "nepa_mcp/_servers/noaa"
"nrhp" = "nepa_mcp/_servers/nrhp"
"padus" = "nepa_mcp/_servers/padus"
"pcsrf" = "nepa_mcp/_servers/pcsrf"
"tigerweb_counties" = "nepa_mcp/_servers/tigerweb_counties"
"tribal" = "nepa_mcp/_servers/tribal"
"usace" = "nepa_mcp/_servers/usace"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"*/server.py" = ["E402"]
