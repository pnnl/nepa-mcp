# GitLab Pages deployment for the docs/ site on CodeSense (codesense.pnnl.gov).
#
# The same static site is published to GitHub Pages from docs/ on this branch.
# GitLab Pages has no equivalent "serve from /docs" setting, so this job copies
# docs/ into public/ — the only directory GitLab Pages serves.
#
# Visibility follows the project's: on a private project the site is reachable
# only by members, provided the instance admin has enabled Pages access control.

pages:
  stage: deploy
  image: alpine:latest
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r docs/. public/
  artifacts:
    paths:
      - public
  # `exists` keeps the job from running (and going red) on branches that do not
  # carry the site — docs/index.html currently lives only on the Pages branch.
  rules:
    - if: $CI_COMMIT_BRANCH == "codex/github-pages-site"
      exists:
        - docs/index.html
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - docs/index.html
